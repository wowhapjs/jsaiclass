server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 charset utf-8;
 sendfile on;
 tcp_nopush on;
 gzip on;
 gzip_min_length 1024;
 gzip_types text/css application/javascript application/json image/svg+xml;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = / { try_files /index.html =404; }
 location = /aiclass1 { return 301 /aiclass1/; }
 location /aiclass1/api/ {
  proxy_pass http://api:3000/api/;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 60s;
 }
 location /aiclass1/media/ {
  proxy_pass http://api:3000/media/;
  proxy_set_header Host $http_host;
  proxy_set_header Range $http_range;
  proxy_set_header If-Range $http_if_range;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 120s;
 }
 location /aiclass1/thumbnails/ {
  try_files $uri =404;
  expires 12h;
  add_header Cache-Control "public, max-age=43200" always;
 }
 location /aiclass1/assets/ {
  try_files $uri =404;
  expires 7d;
  add_header Cache-Control "public, max-age=604800" always;
 }
 location /aiclass1/ { try_files $uri $uri/ /aiclass1/index.html; }
 # Only the reviewed static trial is public; never expose the build worker or uploads.
 location = /dmtwebapp/trial { return 301 /dmtwebapp/trial/; }
 location ^~ /dmtwebapp/trial/ {
  autoindex off;
  if ($uri ~ "(^|/)\\.") { return 404; }
  try_files $uri $uri/ =404;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cache-Control "no-store" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src https://nominatim.openstreetmap.org; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'" always;
 }
 location / { return 404; }
}
