<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="JS AI CLASS — 인공지능 학습을 위한 공간">
  <title>JS AI CLASS</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#09101e;color:#eff4ff}
    *{box-sizing:border-box}
    html{min-height:100%}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse 75% 62% at 75% 5%,#18365d 0%,transparent 65%),radial-gradient(ellipse 55% 60% at 0 100%,#14273d 0%,transparent 73%),#09101e}
    .layout{max-width:1120px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:32px clamp(22px,5vw,64px)}
    header{display:flex;justify-content:space-between;align-items:center;gap:20px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.08em;font-size:17px}
    .mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#a9d6ff;color:#0b1b2e;font-size:18px;box-shadow:0 8px 28px #61b4ff30}
    .state{border:1px solid #ffffff26;border-radius:999px;padding:9px 14px;color:#b9c8df;font-size:12px;letter-spacing:.025em}
    main{flex:1;display:flex;align-items:center;padding:95px 0 110px}
    .inner{max-width:860px}
    .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.2em;color:#a7d3ff;text-transform:uppercase}
    .dot{width:8px;height:8px;background:#8fc9ff;border-radius:50%;box-shadow:0 0 0 5px #8fc9ff14}
    h1{font-size:clamp(52px,10vw,116px);line-height:1.04;letter-spacing:-.078em;margin:27px 0 28px;font-weight:850}
    h1 span{display:block;background:linear-gradient(95deg,#e6f4ff 0%,#8cc8ff 72%,#91a7ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
    p{font-size:clamp(17px,2.5vw,21px);line-height:1.85;color:#b6c5da;letter-spacing:-.03em;margin:0;max-width:580px}
    .note{margin-top:48px;padding-top:24px;border-top:1px solid #ffffff24;color:#91a6c2;font-size:14px}
    footer{padding-top:24px;border-top:1px solid #ffffff19;color:#8194b0;font-size:13px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
    @media(max-width:640px){.layout{padding:22px}.state{font-size:11px}.brand{font-size:14px}main{padding:80px 0}h1{letter-spacing:-.067em}.note{margin-top:35px}}
  </style>
</head>
<body>
<div class="layout">
  <header>
    <div class="brand"><div class="mark" aria-hidden="true">✳</div><span>JS AI CLASS</span></div>
    <span class="state">사이트 준비 중</span>
  </header>
  <main>
    <div class="inner">
      <div class="eyebrow"><span class="dot" aria-hidden="true"></span> LEARN · EXPLORE · CREATE</div>
      <h1>AI를 배우는<br><span>새로운 공간.</span></h1>
      <p>JS AI CLASS에 오신 것을 환영합니다.<br>수업 콘텐츠는 준비 중입니다.</p>
      <div class="note">jsaiclass.duckdns.org</div>
    </div>
  </main>
  <footer><span>© JS AI CLASS</span><span>Learning starts here.</span></footer>
</div>
</body>
</html>
