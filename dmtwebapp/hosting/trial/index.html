<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DMT WebApp · Trial</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#18251f;font:15px system-ui,sans-serif}header{background:#10643e;color:white;padding:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}header strong{font-size:19px}header button{background:#27794f;color:white;border:0}header button.on{background:white;color:#10643e}main{max-width:580px;margin:auto;padding:20px 14px 50px}h1{font-size:25px;margin:4px 0 12px}h2{font-size:18px;margin:0 0 12px}.card{background:white;border:1px solid #dce5df;border-radius:14px;padding:15px;margin:12px 0}.identity{background:#e4f1e9;color:#10643e}.muted,small{color:#5e7066}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.stack{display:flex;gap:8px;flex-wrap:wrap}button,a.btn{font:inherit;font-weight:600;border-radius:9px;border:1px solid #b9cfc0;background:white;color:#10643e;padding:10px 12px;text-decoration:none;cursor:pointer;display:inline-block}button.primary{background:#148343;color:white;border-color:#148343}button.danger{color:#a52424;border-color:#efbcbc}button:disabled{opacity:.42;cursor:not-allowed}label{display:block;font-weight:600;margin:12px 0 5px}input,textarea{width:100%;border:1px solid #bacbc1;border-radius:8px;padding:10px;font:inherit;background:white}textarea{resize:vertical}input[type=file]{border-style:dashed;background:#f1f8f3}.tag{border-radius:20px;padding:4px 9px;background:#e8eee9;font-size:12px;font-weight:600}.live{color:#10643e;background:#d9f1e0}.fail{color:#9b2020;background:#fce8e8}.version{border-top:1px solid #e3e9e4;padding:14px 0}.version:last-child{padding-bottom:0}.url{overflow-wrap:anywhere;color:#10643e;font-size:13px}.notice{padding:10px;border-left:3px solid #148343;background:#f1f8f3;margin:8px 0}.error{color:#a52424}.app{margin:16px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stats div{border:1px solid #dce5df;border-radius:10px;text-align:center;padding:10px}.stats b{display:block;font-size:24px;color:#10643e}.hidden{display:none}footer{text-align:center;color:#6a786e;font-size:12px;margin-top:25px}
</style><header><strong>▣ DMT WebApp</strong><div><button id="en">EN</button> <button id="ko">KO</button></div></header><main><h1 id="heading"></h1><div class="card identity"><strong id="student"></strong><div class="muted">/dmtwebapp/0000/ · Local trial</div></div><div id="stats" class="stats"></div><section class="card"><h2 id="uploadheading"></h2><form id="form"><label id="filelabel" for="zip"></label><input id="zip" type="file" accept=".zip" required><label id="namelabel" for="appname"></label><input id="appname" maxlength="100" required><label id="folderlabel" for="folder"></label><input id="folder" pattern="[a-z0-9][a-z0-9_-]{0,39}" required placeholder="findone"><div class="url" id="url"></div><label id="titlelabel" for="title"></label><input id="title" maxlength="100"><label id="noteslabel" for="notes"></label><textarea id="notes" rows="2" maxlength="1000"></textarea><div class="notice" id="policy"></div><button class="primary" id="upload" type="submit"></button></form><p id="message" role="status"></p></section><section id="apps"></section><footer>Private trial · 127.0.0.1 only · not production</footer></main><script>
let lang=localStorage.getItem('dmtLang')||'en',state={apps:[],preview:''};const $=id=>document.getElementById(id),t=(en,ko)=>lang==='ko'?ko:en;const el=(tag,txt,cls)=>{let e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e};function b(txt,action,cls='',disabled=false){let e=el('button',txt,cls);e.type='button';e.disabled=disabled;e.onclick=action;return e}function a(txt,url){let e=el('a',txt,'btn');e.href=url;e.target='_blank';e.rel='noopener noreferrer';return e}function render(){document.documentElement.lang=lang;$('en').className=lang==='en'?'on':'';$('ko').className=lang==='ko'?'on':'';for(let [id,en,ko] of [['heading','My Applications','내 앱 관리'],['student','Trial student: 0000','시험 학생: 0000'],['uploadheading','Upload a new version','새 버전 업로드'],['filelabel','ZIP file','ZIP 파일'],['namelabel','Application name','앱 이름'],['folderlabel','Application folder','앱 하위 폴더명'],['titlelabel','Version title (optional)','버전 이름 (선택)'],['noteslabel','Release notes (optional)','변경 내용 (선택)'],['policy','New builds are saved without switching the served version. Select a ready version to serve.','새 빌드는 보관되며 서비스 버전은 자동 변경되지 않습니다. 실행 가능한 버전을 직접 선택하세요.'],['upload','Upload & prepare','업로드 및 준비']])$(id).textContent=t(en,ko);$('url').textContent='/dmtwebapp/0000/'+$('folder').value+'/';let ready=state.apps.flatMap(x=>x.versions).filter(v=>v.state==='ready').length;let live=state.apps.filter(a=>a.active!==null).length;$('stats').replaceChildren(...[[state.apps.length,t('Apps','앱')],[ready,t('Ready versions','준비 버전')],[live,t('Serving','서비스 중')]].map(([n,l])=>{let d=el('div');d.append(el('b',n),el('small',l));return d}));let list=$('apps');list.replaceChildren(el('h2',t('Version management','버전 관리')));if(!state.apps.length)list.append(el('p',t('No apps yet. Upload a ZIP to get started.','등록된 앱이 없습니다. ZIP 파일을 업로드하세요.'),'muted'));for(const app of state.apps){let card=el('article',null,'card app'),row=el('div',null,'row');row.append(el('h2',app.name),el('span',app.active===null?t('Not serving','미서비스'):`${t('Serving','서비스 중')} v${app.active}`,'tag '+(app.active?'live':'')));card.append(row,el('div','/0000/'+app.folder+'/','muted'));let actions=el('div',null,'stack');if(app.active!==null)actions.append(a(t('Open live app','서비스 앱 열기'),app.url));actions.append(b(t('Upload update','업데이트'),()=>{$('folder').value=app.folder;$('appname').value=app.name;$('url').textContent='/dmtwebapp/0000/'+app.folder+'/';$('form').scrollIntoView({behavior:'smooth'});$('zip').focus()}));card.append(actions);for(const v of app.versions.filter(v=>v.state!=='deleted')){let d=el('div',null,'version'),r=el('div',null,'row'),active=v.version===app.active;r.append(el('strong',`v${v.version} ${v.title||''}`),el('span',active?t('Serving','서비스 중'):({ready:t('Ready','준비 완료'),failed:t('Failed','실패'),building:t('Building','빌드 중')})[v.state]||v.state,'tag '+(active?'live':v.state==='failed'?'fail':'')));d.append(r,el('small',v.zip_name+' · '+v.created));if(v.notes)d.append(el('p',v.notes));if(v.error)d.append(el('p',v.error,'error'));let buttons=el('div',null,'stack');if(v.state==='ready'){buttons.append(a(t('Test','테스트'),app.url+'versions/'+v.version+'/'),b(t('Serve this version','서비스 버전 지정'),()=>change('serve',app,v), 'primary',active));if(app.active!==null&&v.version<app.active)buttons.append(b(t('Rollback','원복'),()=>change('rollback',app,v)));}if(v.state==='ready'||v.state==='failed')buttons.append(b(t('Delete version','버전 삭제'),()=>change('delete',app,v),'danger',active));d.append(buttons);if(active)d.append(el('small',t('Switch to another version before deleting.','다른 버전을 서비스 버전으로 지정한 뒤 삭제할 수 있습니다.')));card.append(d)}list.append(card)}}
async function refresh(){let r=await fetch('/api/list');if(!r.ok)throw Error('LIST_FAILED');state=await r.json();render()}async function change(action,app,v){const question=action==='delete'?t('Delete version','버전 삭제'):action==='rollback'?t('Rollback to','다음 버전으로 원복'):t('Serve version','서비스 버전 지정');if(!confirm(`${question} v${v.version}?`))return;try{let r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({folder:app.folder,version:v.version})});let j=await r.json();if(!r.ok)throw Error(j.error);$('message').textContent=t('Completed','완료');await refresh()}catch(e){$('message').textContent=e.message}}$('en').onclick=()=>{lang='en';localStorage.setItem('dmtLang',lang);render()};$('ko').onclick=()=>{lang='ko';localStorage.setItem('dmtLang',lang);render()};$('folder').oninput=()=>{$('url').textContent='/dmtwebapp/0000/'+$('folder').value+'/'};$('form').onsubmit=async e=>{e.preventDefault();let f=$('zip').files[0];if(!f)return;let q=new URLSearchParams({filename:f.name,folder:$('folder').value,name:$('appname').value,title:$('title').value,notes:$('notes').value});$('upload').disabled=true;$('message').textContent=t('Uploading and preparing…','업로드 및 준비 중…');try{let r=await fetch('/api/upload?'+q,{method:'POST',headers:{'Content-Type':'application/zip'},body:f});let j=await r.json();if(!r.ok)throw Error(j.error);$('message').textContent=t('Version ready: ','버전 준비 완료: ')+'v'+j.version;$('zip').value='';}catch(e){$('message').textContent=t('Failed: ','실패: ')+e.message}finally{$('upload').disabled=false;await refresh()}};render();refresh().catch(e=>$('message').textContent=e.message);
</script></html>
