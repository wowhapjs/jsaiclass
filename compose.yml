services:
  web:
    image: nginx:alpine
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./aiclass1/frontend/dist:/usr/share/nginx/html/aiclass1:ro
      - ./aiclass1/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    container_name: jsaiclass
    restart: unless-stopped
    ports:
      - "127.0.0.1:31007:80"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=4m,mode=0755
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
  api:
    build:
      context: .
      dockerfile: aiclass1/api/Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: aiclassapp
      PGDATABASE: aiclass1
      PGPASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    group_add: ['2000']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiclassapp
      POSTGRES_DB: aiclass1
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    group_add: ['2000']
    volumes:
      - aiclass1_db:/var/lib/postgresql/data
      - ./aiclass1/api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U aiclassapp -d aiclass1"]
      interval: 5s
      timeout: 3s
      retries: 15
    security_opt:
      - no-new-privileges:true
secrets:
  db_password:
    file: /etc/web-manager/secrets/aiclass1/db_password
volumes:
  aiclass1_db:
