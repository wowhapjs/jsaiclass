services:
  web:
    image: nginx:alpine
    container_name: jsaiclass
    restart: unless-stopped
    ports:
      - "127.0.0.1:31007:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=4m,mode=0755
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
